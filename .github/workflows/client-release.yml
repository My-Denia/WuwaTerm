name: Windows client release
on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Full main commit SHA to build
        required: true
        type: string
      dry_run:
        description: Build artifacts without creating a draft
        type: boolean
        default: true
      validation_run_id:
        description: Successful CI dispatch run ID when the source lacks a main-push receipt
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: client-release-dispatch
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      client_version: ${{ steps.source.outputs.client_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate source and client version
        id: source
        env:
          TARGET: ${{ inputs.target_commit }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONTROL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          if [ "$DRY_RUN" = false ]; then
            test "$CONTROL_REF" = refs/heads/main
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$TARGET" origin/main
          fi
          version=$(python -c 'import tomllib; print(tomllib.load(open("client/pyproject.toml", "rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "client_version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check out trusted release control
        if: inputs.dry_run == false
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-control
          fetch-depth: 0
      - name: Verify successful CI for the actual source
        if: inputs.dry_run == false
        working-directory: .release-control
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ -n "$VALIDATION_RUN_ID" ]; then
            python scripts/verify_ci_source.py verify "$SOURCE_COMMIT" --require-client --run-id "$VALIDATION_RUN_ID"
          else
            python scripts/verify_ci_source.py verify "$SOURCE_COMMIT" --require-client
          fi

  client:
    name: desktop client zip (windows)
    needs: preflight
    uses: ./.github/workflows/windows-client.yml
    with:
      source_commit: ${{ needs.preflight.outputs.source_commit }}
      release_zip: true
      client_version: ${{ needs.preflight.outputs.client_version }}

  draft:
    needs: [preflight, client]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: client-zip
          path: staging
      - name: Create independent client draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.client_version }}
          SOURCE: ${{ needs.preflight.outputs.source_commit }}
        run: |
          set -euo pipefail
          tag="client-v$VERSION"
          status=0
          gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2> tag-error || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Client tag already exists" >&2
            exit 1
          fi
          # Only a confirmed missing tag permits a new draft.
          grep -q 'HTTP 404' tag-error
          cd staging
          sha256sum *.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf '{"client_version":"%s","source_commit":"%s"}\n' "$VERSION" "$SOURCE" > client-manifest.json
          printf 'Windows client %s. Source: %s.\n\nUNSIGNED: Windows SmartScreen may warn. Verify SHA256SUMS before use.\nRequires WuwaTerm API >=0.3.0 with schema v1. Client development remains paused.\n' "$VERSION" "$SOURCE" > ../notes.md
          gh release create "$tag" --draft --latest=false --target "$SOURCE" \
            --title "Windows client $VERSION" --notes-file ../notes.md \
            *.zip SHA256SUMS client-manifest.json
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$SOURCE"
          test "$(gh release view "$tag" --json assets --jq '.assets | length')" -eq 3
