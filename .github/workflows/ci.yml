name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Full main-ancestor SHA to validate with the current main workflow
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source:
    name: Resolve source
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      source_epoch: ${{ steps.epoch.outputs.source_epoch }}
      telegram_optional: ${{ steps.epoch.outputs.telegram_optional }}
      manuscript_interop: ${{ steps.epoch.outputs.manuscript_interop }}
      web_revision: ${{ steps.epoch.outputs.web_revision }}
      windows_revision: ${{ steps.epoch.outputs.windows_revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Resolve source
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          TARGET: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$REF" = refs/heads/main
            [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$TARGET" origin/main
            source_commit=$(git rev-parse "$TARGET^{commit}")
            test "$source_commit" = "$TARGET"
          else
            [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$EVENT_SHA^{commit}" || git fetch --no-tags origin "$EVENT_SHA"
            source_commit=$(git rev-parse "$EVENT_SHA^{commit}")
            test "$source_commit" = "$EVENT_SHA"
          fi
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Resolve source epoch from control
        id: epoch
        env:
          SOURCE: ${{ steps.resolve.outputs.source_commit }}
          CONTROL: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL"
          python scripts/ci_source_epoch.py resolve "$SOURCE" --workflow .github/workflows/ci.yml > "$RUNNER_TEMP/epoch.json"
          jq -e '
            (.source_epoch == "legacy" or .source_epoch == "split") and
            (.telegram_optional | type == "boolean") and
            (.manuscript_interop | type == "boolean") and
            (.web_revision | type == "string" and test("^[0-9a-f]{40}$")) and
            (if .source_epoch == "legacy" then .windows_revision == null
             else (.windows_revision | type == "string" and test("^[0-9a-f]{40}$")) end)
          ' "$RUNNER_TEMP/epoch.json" > /dev/null
          for key in source_epoch telegram_optional manuscript_interop web_revision windows_revision; do
            printf '%s=%s\n' "$key" "$(jq -r --arg key "$key" 'if .[$key] == null then "" else .[$key] | tostring end' "$RUNNER_TEMP/epoch.json")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.source_commit }}
      - name: Confirm actual checkout
        env:
          SOURCE: ${{ steps.resolve.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE"

  test:
    needs: source
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor is requires-python >=3.11 with no upper bound, so
        # the versions above the floor are tested rather than assumed. A red
        # one is removed from this list with the reason recorded, never hidden
        # behind an upper bound the package does not need.
        # Every supported version runs on main and on a dispatch, which is what
        # the release receipt binds. A pull request runs the floor and the top
        # of the range only: the intermediate versions stay supported and are
        # still exercised by the main push that follows the merge, and this is
        # the feedback-frequency change MY-159 asks for, not a support cut.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.14"]' || '["3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - name: Install source dependencies
        env:
          TELEGRAM_OPTIONAL: ${{ needs.source.outputs.telegram_optional }}
        run: |
          if [ "$TELEGRAM_OPTIONAL" = true ]; then
            python -m pip install -e ".[dev,telegram]"
          else
            python -m pip install -e ".[dev]"
          fi
      # One entry point, and it is the same one a contributor is told to run:
      # hygiene, architecture, API contract, ruff, then the suite.
      # Listing the gates here as separate steps is what let CI and the
      # documentation drift apart; the list lives in scripts/validate.py now.
      # Coverage measurement and regression floor are enforced on the baseline
      # Python 3.11 job only, avoiding the wall-clock cost on every matrix leg.
      - name: Validate with coverage floor (Python 3.11)
        if: matrix.python-version == '3.11'
        run: python scripts/validate.py --cov
      - name: Validate
        if: matrix.python-version != '3.11'
        run: python scripts/validate.py

  lock:
    needs: source
    name: uv locked runtime behavior (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Pin uv to the same version the deploy images use (deploy/Dockerfile).
      - run: python -m pip install -U pip uv==0.11.3
      - run: uv lock --check
      # The floating pytest matrix above checks compatibility. This job uses
      # the SAME locked dependency resolution and serving extras as the runtime
      # image. Bind uv explicitly to 3.11 rather than its managed default.
      - name: Install locked runtime dependencies
        env:
          TELEGRAM_OPTIONAL: ${{ needs.source.outputs.telegram_optional }}
        run: |
          extras=(--extra api --extra dev)
          if [ "$TELEGRAM_OPTIONAL" = true ]; then extras+=(--extra telegram); fi
          uv sync --locked --python 3.11 "${extras[@]}"
      - name: Record locked runtime interpreter and dependencies
        run: .venv/bin/python -c "import sys, importlib.metadata as m; print(sys.version); print({p:m.version(p) for p in ['fastapi','starlette','pydantic','httpx','python-telegram-bot']})"
      - run: .venv/bin/python scripts/validate.py

  web-contract:
    needs: source
    name: API to Web contract
    runs-on: ubuntu-latest
    # Runs the dispatched commit read-only: the source job already proved it is
    # a main ancestor, and no workflow here uses an Actions cache.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.source_commit }}
      - name: Read immutable Web revision
        id: web
        run: |
          set -euo pipefail
          revision=$(cat contracts/web-ref.txt)
          test "$revision" = "${{ needs.source.outputs.web_revision }}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Backend source: $(git rev-parse HEAD)"
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm-Web
          ref: ${{ steps.web.outputs.revision }}
          path: web
      - name: Verify Web source
        run: test "$(git -C web rev-parse HEAD)" = "${{ steps.web.outputs.revision }}"
      - name: Read Web's immutable Windows revision
        if: needs.source.outputs.source_epoch == 'split'
        id: web-windows
        run: |
          set -euo pipefail
          revision=$(cat web/contracts/windows-ref.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: needs.source.outputs.source_epoch == 'split'
        with:
          repository: My-Denia/WuwaTerm-Windows
          ref: ${{ steps.web-windows.outputs.revision }}
          path: windows
      - name: Verify Web's Windows source
        if: needs.source.outputs.source_epoch == 'split'
        run: test "$(git -C windows rev-parse HEAD)" = "${{ steps.web-windows.outputs.revision }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install source dependencies
        env:
          TELEGRAM_OPTIONAL: ${{ needs.source.outputs.telegram_optional }}
        run: |
          if [ "$TELEGRAM_OPTIONAL" = true ]; then
            python -m pip install -e ".[dev,telegram]"
          else
            python -m pip install -e ".[dev]"
          fi
      - run: python -m pytest -m cross_component tests/test_meta_site_contract.py
        env:
          WUWATERM_WEB_ROOT: ${{ github.workspace }}/web
      - name: Check actual manuscript interop in both directions
        if: needs.source.outputs.manuscript_interop == 'true'
        env:
          WUWATERM_WEB_ROOT: ${{ github.workspace }}/web
          PYTHONPATH: ${{ github.workspace }}/client/src
        run: |
          set -euo pipefail
          command -v node
          test -f client/tests/test_manuscript.py
          python -m pytest -q client/tests/test_manuscript.py::test_actual_web_and_client_read_each_others_files --junitxml="$RUNNER_TEMP/manuscript.xml"
          python - "$RUNNER_TEMP/manuscript.xml" <<'PYMANUSCRIPT'
          import sys, xml.etree.ElementTree as ET
          suites = ET.parse(sys.argv[1]).getroot().iter('testsuite')
          totals = [(int(s.attrib.get('tests', 0)), int(s.attrib.get('skipped', 0))) for s in suites]
          if sum(t for t, _ in totals) != 1 or sum(s for _, s in totals):
              raise SystemExit('actual manuscript interop did not run exactly once')
          PYMANUSCRIPT
      - run: npm run test:contract
        working-directory: web
        env:
          WUWATERM_BACKEND_ROOT: ${{ github.workspace }}
          WUWATERM_WINDOWS_ROOT: ${{ github.workspace }}/windows

  windows-contract:
    if: needs.source.outputs.source_epoch == 'split'
    needs: source
    name: API to Windows contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.source_commit }}
      - name: Read immutable Windows revision
        id: windows
        run: |
          set -euo pipefail
          revision=$(cat contracts/windows-ref.txt)
          test "$revision" = "${{ needs.source.outputs.windows_revision }}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm-Windows
          ref: ${{ steps.windows.outputs.revision }}
          path: windows
      - name: Verify Windows source
        run: test "$(git -C windows rev-parse HEAD)" = "${{ steps.windows.outputs.revision }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,telegram]"
      - run: python -m pytest -m cross_component tests/test_windows_contract.py
        env:
          WUWATERM_WINDOWS_ROOT: ${{ github.workspace }}/windows

  package:
    name: wheel/sdist build, audit, install
    needs: source
    uses: ./.github/workflows/python-package.yml
    with:
      source_commit: ${{ needs.source.outputs.source_commit }}
      upload_package: true
      candidate_metadata: true

  historical-windows:
    name: Historical bundled Windows validation
    needs: source
    if: needs.source.outputs.source_epoch == 'legacy'
    uses: My-Denia/WuwaTerm-Windows/.github/workflows/legacy-core-validation.yml@974160e74286f03463ab98c4e1b1ab1d45be2bfc
    with:
      source_commit: ${{ needs.source.outputs.source_commit }}

  deploy-boundary:
    needs: source
    name: docker runtime/builder boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.source_commit }}
      - name: Syntax-check deploy shell scripts
        run: |
          for f in deploy/*.sh; do sh -n "$f"; done
      - name: Validate compose config with placeholder env
        run: |
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml config -q
          rm .env
      - run: docker build -f deploy/Dockerfile --target runtime -t wuwaterm-runtime:ci .
      - run: docker build -f deploy/Dockerfile --target builder -t wuwaterm-builder:ci .
      - name: Runtime image refuses data-build commands
        run: |
          for forbidden in build-db refresh-data verify-db; do
            status=0
            docker run --rm wuwaterm-runtime:ci "$forbidden" || status=$?
            test "$status" -eq 64
          done
      - name: Runtime image serves both inbound surfaces
        run: |
          docker run --rm --entrypoint sh wuwaterm-runtime:ci -c 'python -c "import wuwaterm.bot, wuwaterm_api.app"'
          docker run --rm wuwaterm-runtime:ci api --help >/dev/null
          docker run --rm wuwaterm-runtime:ci device list >/dev/null
      - name: Runtime image excludes builder tooling; builder retains git
        run: |
          docker run --rm --entrypoint sh wuwaterm-runtime:ci -c '! command -v git && ! command -v uv && ! command -v uvx'
          docker run --rm --entrypoint sh wuwaterm-builder:ci -c 'command -v git >/dev/null'
          if [ "${{ needs.source.outputs.telegram_optional }}" = true ]; then
            docker run --rm --entrypoint python wuwaterm-builder:ci -c "import importlib.util; assert importlib.util.find_spec('telegram') is None"
          else
            docker run --rm --entrypoint python wuwaterm-builder:ci -c "import importlib.util; assert importlib.util.find_spec('telegram') is not None"
          fi
      - name: Runtime image excludes WebSocket implementations
        run: |
          docker run --rm --entrypoint python wuwaterm-runtime:ci -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('websockets', 'wsproto'))"

  receipt:
    name: validated source
    needs: [source, test, lock, web-contract, windows-contract, historical-windows, package, deploy-boundary]
    if: >-
      ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.source.result == 'success' && needs.test.result == 'success'
      && needs.lock.result == 'success' && needs.web-contract.result == 'success'
      && ((needs.source.outputs.source_epoch == 'split' && needs.windows-contract.result == 'success' && needs.historical-windows.result == 'skipped')
      || (needs.source.outputs.source_epoch == 'legacy' && needs.historical-windows.result == 'success' && needs.windows-contract.result == 'skipped'))
      && needs.package.result == 'success' && needs.deploy-boundary.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Write source receipt
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.source_commit }}
          CONTROL_COMMIT: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_COMMIT"
          python - <<'PYRECEIPT'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from ci_source_epoch import load_config, resolve, validate_workflow
          raw = Path('contracts/ci-source-epochs.json').read_bytes()
          config = load_config(raw)
          validate_workflow(Path('.github/workflows/ci.yml').read_text(), config)
          selection = resolve(os.environ['SOURCE_COMMIT'], config)
          receipt = {
              'schema': 2,
              'source_commit': os.environ['SOURCE_COMMIT'],
              'control_commit': os.environ['CONTROL_COMMIT'],
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'event': os.environ['EVENT'],
              'backend_scope': 'full',
              'control_config_sha256': hashlib.sha256(raw).hexdigest(),
          }
          for key in ('source_epoch', 'windows_recipe_sha', 'windows_recipe_workflow', 'web_repository', 'web_revision', 'windows_repository', 'windows_revision', 'required_jobs'):
              receipt[key] = selection[key]
          Path('validated-source.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PYRECEIPT
      - uses: actions/upload-artifact@v7
        with:
          name: validated-source-${{ github.run_attempt }}
          path: validated-source.json
          if-no-files-found: error
