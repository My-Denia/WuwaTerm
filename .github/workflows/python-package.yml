name: Python package

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      upload_package:
        default: false
        type: boolean
      candidate_metadata:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: build and smoke
    runs-on: ubuntu-latest
    steps:
      # The reusable workflow is from CONTROL, even when SOURCE is older and
      # has no epoch resolver. Resolve before replacing the checkout.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Resolve source epoch from workflow control
        id: epoch
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CONTROL_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_COMMIT"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          epoch=$(python scripts/ci_source_epoch.py resolve "$SOURCE_COMMIT" --workflow .github/workflows/ci.yml)
          telegram_optional=$(jq -er '.telegram_optional | if type == "boolean" then tostring else error("expected boolean") end' <<< "$epoch")
          public_interface_smoke=$(jq -er '.public_interface_smoke | if type == "boolean" then tostring else error("expected boolean") end' <<< "$epoch")
          echo "telegram_optional=$telegram_optional" >> "$GITHUB_OUTPUT"
          echo "public_interface_smoke=$public_interface_smoke" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - name: Confirm clean source checkout
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_package_artifacts.py dist/*.whl dist/*.tar.gz
      - name: Install wheel into a clean venv and smoke it
        env:
          TELEGRAM_OPTIONAL: ${{ steps.epoch.outputs.telegram_optional }}
          PUBLIC_INTERFACE_SMOKE: ${{ steps.epoch.outputs.public_interface_smoke }}
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/pip" install --no-cache-dir dist/*.whl
          "$RUNNER_TEMP/venv-wheel/bin/python" -c "import wuwaterm"
          "$RUNNER_TEMP/venv-wheel/bin/python" -c "import wuwaterm_api"
          if [ "$TELEGRAM_OPTIONAL" = true ]; then
            "$RUNNER_TEMP/venv-wheel/bin/python" -c "import importlib.util; assert importlib.util.find_spec('telegram') is None"
          else
            test "$TELEGRAM_OPTIONAL" = false
            "$RUNNER_TEMP/venv-wheel/bin/python" -c "import telegram"
          fi
          if [ "$PUBLIC_INTERFACE_SMOKE" = true ]; then
            "$RUNNER_TEMP/venv-wheel/bin/python" -I scripts/check_package_public_interface.py --mode core
          else
            test "$PUBLIC_INTERFACE_SMOKE" = false
          fi
          "$RUNNER_TEMP/venv-wheel/bin/wuwaterm" --help
          "$RUNNER_TEMP/venv-wheel/bin/wuwaterm-api" --help
      - name: Install API and build extras into clean venvs
        env:
          TELEGRAM_OPTIONAL: ${{ steps.epoch.outputs.telegram_optional }}
          PUBLIC_INTERFACE_SMOKE: ${{ steps.epoch.outputs.public_interface_smoke }}
        run: |
          wheel=(dist/*.whl)
          test "${#wheel[@]}" -eq 1
          for extra in api build; do
            python -m venv "$RUNNER_TEMP/venv-$extra"
            "$RUNNER_TEMP/venv-$extra/bin/pip" install --no-cache-dir "${wheel[0]}[$extra]"
            if [ "$TELEGRAM_OPTIONAL" = true ]; then
              "$RUNNER_TEMP/venv-$extra/bin/python" -c "import importlib.util; assert importlib.util.find_spec('telegram') is None"
            else
              test "$TELEGRAM_OPTIONAL" = false
              "$RUNNER_TEMP/venv-$extra/bin/python" -c "import telegram"
            fi
            if [ "$PUBLIC_INTERFACE_SMOKE" = true ]; then
              "$RUNNER_TEMP/venv-$extra/bin/python" -I scripts/check_package_public_interface.py --mode "$extra"
            else
              test "$PUBLIC_INTERFACE_SMOKE" = false
            fi
            "$RUNNER_TEMP/venv-$extra/bin/wuwaterm" --help
          done
          "$RUNNER_TEMP/venv-api/bin/python" -c "import wuwaterm_api.app"
          "$RUNNER_TEMP/venv-build/bin/python" -c "import pypinyin, wuwaterm.builder"
      - name: Install sdist into a clean venv and smoke it
        env:
          TELEGRAM_OPTIONAL: ${{ steps.epoch.outputs.telegram_optional }}
          PUBLIC_INTERFACE_SMOKE: ${{ steps.epoch.outputs.public_interface_smoke }}
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/pip" install --no-cache-dir dist/*.tar.gz
          "$RUNNER_TEMP/venv-sdist/bin/python" -c "import wuwaterm"
          "$RUNNER_TEMP/venv-sdist/bin/python" -c "import wuwaterm_api"
          if [ "$TELEGRAM_OPTIONAL" = true ]; then
            "$RUNNER_TEMP/venv-sdist/bin/python" -c "import importlib.util; assert importlib.util.find_spec('telegram') is None"
          else
            test "$TELEGRAM_OPTIONAL" = false
            "$RUNNER_TEMP/venv-sdist/bin/python" -c "import telegram"
          fi
          if [ "$PUBLIC_INTERFACE_SMOKE" = true ]; then
            "$RUNNER_TEMP/venv-sdist/bin/python" -I scripts/check_package_public_interface.py --mode core
          else
            test "$PUBLIC_INTERFACE_SMOKE" = false
          fi
          "$RUNNER_TEMP/venv-sdist/bin/wuwaterm" --help
          "$RUNNER_TEMP/venv-sdist/bin/wuwaterm-api" --help
      - name: Record package checksums and source
        if: inputs.upload_package && inputs.candidate_metadata
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --quiet
          git diff --cached --quiet
          python - <<'PY'
          import hashlib, json, os, subprocess, tomllib
          from pathlib import Path

          dist = Path('dist')
          wheels = sorted(dist.glob('*.whl'))
          sdists = sorted(dist.glob('*.tar.gz'))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit('expected exactly one wheel and one sdist')
          files = wheels + sdists
          checksums = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          (dist / 'SHA256SUMS').write_text(
              ''.join(f'{digest}  {name}\n' for name, digest in checksums.items()),
              encoding='utf-8',
          )
          with Path('pyproject.toml').open('rb') as handle:
              version = tomllib.load(handle)['project']['version']
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          manifest = {
              'schema': 1,
              'version': version,
              'source_commit': os.environ['SOURCE_COMMIT'],
              'source_tree': tree,
              'sha256': checksums,
          }
          (dist / 'source-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: inputs.upload_package && !inputs.candidate_metadata
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: inputs.upload_package && inputs.candidate_metadata
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/source-manifest.json
          if-no-files-found: error
