name: Windows client

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      release_zip:
        default: false
        type: boolean
      client_version:
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m venv client/.venv
      - run: client/.venv/Scripts/python.exe -m pip install -U pip
      - run: client/.venv/Scripts/python.exe -m pip install -e "client[dev,build]"
      - name: Client test suite
        working-directory: client
        run: .venv/Scripts/python.exe -m pytest
      # build.ps1 performs the actual EXE self-check before it creates the zip.
      - name: One-folder PyInstaller build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File client/build.ps1
      - name: Validate the produced zip
        shell: pwsh
        env:
          CLIENT_VERSION: ${{ inputs.client_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(Get-ChildItem client/dist/WuwaTerm-*-windows-x64.zip)
          if ($archives.Count -ne 1 -or $archives[0].Length -le 0) {
            throw "Expected one nonempty Windows release zip"
          }
          if ($env:CLIENT_VERSION -and $archives[0].Name -ne "WuwaTerm-$env:CLIENT_VERSION-windows-x64.zip") {
            throw "The zip name does not match the preflight version"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archives[0].FullName)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            if ('WuwaTerm/WuwaTerm.exe' -notin $names -or -not ($names | Where-Object { $_ -like 'WuwaTerm/*.qss' })) {
              throw "The zip is missing the executable or its stylesheets"
            }
          } finally { $zip.Dispose() }
      - name: The build output must stay out of the working tree
        shell: bash
        run: |
          dirt="$(git status --porcelain)"
          if [ -n "$dirt" ]; then
            echo "a build left files the ignore rules do not cover:" >&2
            echo "$dirt" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.release_zip }}
        with:
          name: WuwaTerm-windows
          path: client/dist/WuwaTerm/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: inputs.release_zip
        with:
          name: client-zip
          path: client/dist/WuwaTerm-${{ inputs.client_version }}-windows-x64.zip
          if-no-files-found: error
