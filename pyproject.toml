[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwaterm"
version = "0.8.1"
description = "WuwaTerm: dictionary-first Wuthering Waves Chinese-English terminology and contextual-term translation service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Peter" }]
dependencies = [
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://wuwaterm.denia-official.chatgpt.site"
Repository = "https://github.com/My-Denia/WuwaTerm"
Issues = "https://github.com/My-Denia/WuwaTerm/issues"
Documentation = "https://github.com/My-Denia/WuwaTerm/blob/main/docs/README.md"
Changelog = "https://github.com/My-Denia/WuwaTerm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
build = [
  "pypinyin>=0.54,<1",
]
# The existing Telegram bot and HTTP adapter can be installed independently.
telegram = [
  "python-telegram-bot>=22.7,<23",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "pypinyin>=0.54,<1",
  # The test suite runner and coverage measurement.
  "pytest>=8.0,<10",
  "pytest-cov>=6.0,<8",
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  # The linter is part of the validation entry (scripts/validate.py), so it is
  # a development dependency rather than something a contributor installs by
  # hand. Bounded to one minor: the enabled rule set below is written against
  # what this range enforces, and a wider range would silently change the gate.
  "ruff>=0.16,<0.18",
  # The type checker is part of the validation entry (scripts/validate.py), so
  # it is a development dependency rather than something a contributor installs
  # by hand. Bounded to one minor: upstream type inference or stdlib stub
  # changes in a wider range would silently change the baseline.
  "mypy>=2.4,<2.5",
]

[project.scripts]
wuwaterm = "wuwaterm.cli:main"
wuwaterm-api = "wuwaterm_api.cli:main"

[tool.uv]
# certifi is transitive (httpx -> httpcore/certifi) and nobody imports it
# directly, so it is not a project dependency. The floor is here because the
# bundled CA store is what the bot and API actually trust when httpx opens TLS
# to Telegram and the LLM endpoints: 2026.6.17 still ships the emSign ECC
# Root CA - G3 chain whose intermediates had compromised keys (PYSEC-2026-4320
# / GHSA-6q48-6c7w-9gw2). 2026.10.18 dropped the affected roots and 2026.10.19
# put back the ones that were not compromised, so the floor is the latter.
# This is enforced when the lock is resolved, not by `uv lock --check`: a lock
# pinning certifi below the floor still passes `--check` under both uv 0.11.3
# and 0.13.7 (measured 2026-11-11), so the CI job that runs `uv lock --check`
# is a drift check, not a vulnerability gate.
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Keep a test's tmp_path only when it failed, and only the latest run's; the
# default keeps every passing test's directory for the last three runs.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
addopts = "-q --strict-config --strict-markers -m 'not cross_component'"
markers = [
  "cross_component: requires a pinned external product checkout",
  "closed_fd9: the test call runs with file descriptor 9 closed, as build-delivery.sh runs the artifact tools",
]

[tool.ruff]
# Ruff takes the target version from project.requires-python. Generated data,
# virtual environments and run folders are already excluded because ruff honours
# .gitignore, so no extra exclusion list is carried here.

[tool.ruff.lint]
# Written out rather than left to the default so the gate cannot change under
# the repository when the linter's own defaults move. E4 import placement, E7
# statement-level errors, E9 syntax/IO errors, F the whole pyflakes set
# (undefined names, unused imports, unused variables, f-string mistakes).
# Style and modernisation rules are deliberately NOT enabled: this is a
# correctness gate, and a formatting sweep is a separate decision.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
# Missing third-party vendor stubs are ignored globally rather than via per-file
# silences, so the gate reports our own type errors rather than upstream gaps.
ignore_missing_imports = true

# Baseline overrides for modules carrying existing type errors as of #208.
# Only modules that fail the initial 50-error baseline are listed; all other
# modules are checked strictly. Cleaned-up modules must drop their override.

# Optional lookup key indexing dict[str, SourceProfile]
[[tool.mypy.overrides]]
module = "wuwaterm.constants"
ignore_errors = true

# Platform-specific msvcrt locking attributes absent on non-Windows
[[tool.mypy.overrides]]
module = "wuwaterm.settings"
ignore_errors = true

# Keyword argument duplication, untyped callables, and tuple/list mismatches
[[tool.mypy.overrides]]
module = "wuwaterm.review"
ignore_errors = true

# Dynamic dict kwargs unpacking to LLM caller helpers and optional flags
[[tool.mypy.overrides]]
module = "wuwaterm.sentence"
ignore_errors = true

# Optional attribute assignments to str and empty tuple set-union operand
[[tool.mypy.overrides]]
module = "wuwaterm.builder"
ignore_errors = true

# Untyped pipeline stage objects and candidate attribute accesses
[[tool.mypy.overrides]]
module = "wuwaterm.application"
ignore_errors = true

# Untyped collection initialisation, missing exception attributes, and optional timedelta
[[tool.mypy.overrides]]
module = "wuwaterm.channel"
ignore_errors = true

# Reused loop variable name and optional exception parameter
[[tool.mypy.overrides]]
module = "wuwaterm.bot"
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true
precision = 2
